{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block mensagens %}{% endblock %}

{% block conteudo %}
<div class="tela-acesso">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h3 text-center mb-1"><i class="bi bi-box-seam text-primary"></i> EstoqueFácil</h1>
      <p class="text-center text-muted mb-4">Controle de estoque simples para o seu comércio</p>
      {% include "_mensagens.html" %}
      <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label for="email" class="form-label">E-mail *</label>
          <input type="email" id="email" name="email" class="form-control" value="{{ form.get('email', '') }}" autocomplete="email" autofocus>
        </div>
        <div class="mb-3">
          <label for="senha" class="form-label">Senha *</label>
          <input type="password" id="senha" name="senha" class="form-control" autocomplete="current-password">
        </div>
        <button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Entrar</button>
      </form>
      <p class="text-center mt-3 mb-0">Não tem conta? <a href="{{ url_for('auth.cadastro') }}">Criar conta</a></p>
    </div>
  </div>
</div>
{% endblock %}
